// Mods that only ever exist in a dev run, one configuration each so a run can pick the combination
// it wants. The coordinates are declared in dependencies.gradle.
configurations {
    testmodJade
    testmodJei
    testmodEmi
}

// Every run shares the run/ game directory, so each one stages the mods folder it wants before it
// launches. This is deliberately a Sync and not a Copy: leaving the previous run's recipe viewer
// behind would make "the EMI run" and "the JEI run" mean nothing. It also means run/mods is owned by
// these tasks — a jar dropped in there by hand is deleted on the next launch.
//
// Staging into the mods folder rather than onto the run classpath is not a matter of taste:
// RunModel.additionalRuntimeClasspathConfiguration reaches the game as a plain library, and FML
// never scans those entries for mod metadata, so mods added that way silently fail to load.
def stageTestmods = { String taskName, String description, Object... testmods ->
    tasks.register(taskName, Sync) {
        it.group = 'neoforge runs'
        it.description = description
        it.into layout.projectDirectory.dir('run/mods')
        testmods.each { testmod -> it.from testmod }
    }
}

def stageNoTestmods = stageTestmods('stageNoTestmods', 'Empties run/mods.')
def stageJeiTestmods = stageTestmods('stageJeiTestmods', 'Puts Jade and JEI in run/mods.',
    configurations.testmodJade, configurations.testmodJei)
def stageEmiTestmods = stageTestmods('stageEmiTestmods', 'Puts Jade and EMI in run/mods.',
    configurations.testmodJade, configurations.testmodEmi)
def stageEmiJeiTestmods = stageTestmods('stageEmiJeiTestmods', 'Puts Jade, EMI and JEI in run/mods.',
    configurations.testmodJade, configurations.testmodEmi, configurations.testmodJei)

neoForge {
    version = libs.versions.neoForge.get()

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    var isJbr = System.getProperty('java.vm.vendor').contains('JetBrains')

    runs {
        client {
            client()
            programArguments.addAll "--width", "1440", "--height", "841"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore stageNoTestmods
        }

        // The same client with a recipe viewer alongside Jade, one run per viewer combination.
        // Recipe viewers disagree about who owns the item list, so JEI and EMI are only loaded
        // together in the run meant to test exactly that.
        clientJei {
            client()
            ideName = 'Client (JEI)'
            programArguments.addAll "--width", "1440", "--height", "841"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore stageJeiTestmods
        }

        clientEmi {
            client()
            ideName = 'Client (EMI)'
            programArguments.addAll "--width", "1440", "--height", "841"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore stageEmiTestmods
        }

        clientEmiJei {
            client()
            ideName = 'Client (EMI + JEI)'
            programArguments.addAll "--width", "1440", "--height", "841"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore stageEmiJeiTestmods
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore stageNoTestmods
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            taskBefore stageNoTestmods
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            // This mod's block models parent onto AnvilCraft's crate models, so AnvilCraft's own
            // resources have to be visible to the model providers' existing-file checks.
            programArguments.addAll '--existing-mod', 'anvilcraft'
        }

        configureEach {
            if (isJbr) {
                jvmArgument "-XX:+AllowEnhancedClassRedefinition"
            }
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
