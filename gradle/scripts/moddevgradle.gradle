// Mods that only ever exist in a dev run, one configuration each so a run can pick the combination
// it wants. The coordinates are declared in dependencies.gradle.
configurations {
    testmodJade
    testmodJei
    testmodEmi
}

neoForge {
    version = libs.versions.neoForge.get()

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    var isJbr = System.getProperty('java.vm.vendor').contains('JetBrains')

    runs {
        client {
            client()
            programArguments.addAll "--width", "1440", "--height", "841"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // The same client with a recipe viewer alongside Jade, one run per viewer combination.
        // Recipe viewers disagree about who owns the item list, so JEI and EMI are only loaded
        // together in the run meant to test exactly that.
        clientJei {
            client()
            ideName = 'Client (JEI)'
            programArguments.addAll "--width", "1440", "--height", "841"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            additionalRuntimeClasspathConfiguration.extendsFrom configurations.testmodJade,
                configurations.testmodJei
        }

        clientEmi {
            client()
            ideName = 'Client (EMI)'
            programArguments.addAll "--width", "1440", "--height", "841"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            additionalRuntimeClasspathConfiguration.extendsFrom configurations.testmodJade,
                configurations.testmodEmi
        }

        clientEmiJei {
            client()
            ideName = 'Client (EMI + JEI)'
            programArguments.addAll "--width", "1440", "--height", "841"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            additionalRuntimeClasspathConfiguration.extendsFrom configurations.testmodJade,
                configurations.testmodEmi, configurations.testmodJei
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            // This mod's block models parent onto AnvilCraft's crate models, so AnvilCraft's own
            // resources have to be visible to the model providers' existing-file checks.
            programArguments.addAll '--existing-mod', 'anvilcraft'
        }

        configureEach {
            if (isJbr) {
                jvmArgument "-XX:+AllowEnhancedClassRedefinition"
            }
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
