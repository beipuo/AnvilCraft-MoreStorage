[versions]
minecraft = "1.21.1"
neoForge = "21.1.241"
# AnvilCraft's crate storage API (CrateBlock, Storages, StorageRef, ...) only exists from
# 1.6.0+snapshot.2187 onwards, and the storage type registry this mod compiles against
# (IStorageType, ModStorageTypes) replaced the old StorageType enum in 2203, so that is the real
# floor now. anvillib is pinned to the version this AnvilCraft build itself depends on.
anvillib = "2.0.0+snapshot.516"
anvilcraft = "1.6.0+snapshot.2225"
modDevGradle = "2.0.142"
lombok = "8.7.1"
# Mods loaded only into the dev runs, never dependencies of the built jar. A CurseForge "version" is
# a file ID, so bumping one of these means picking a new file from the project's Files page:
# Jade https://www.curseforge.com/minecraft/mc-mods/jade/files
# JEI  https://www.curseforge.com/minecraft/mc-mods/jei/files
# EMI  https://www.curseforge.com/minecraft/mc-mods/emi/files
jade = "8591319"
jei = "8732390"
emi = "8081408"

[libraries]
anvillib = { group = "dev.anvilcraft.lib", name = "anvillib-neoforge-1.21.1", version.ref = "anvillib" }
anvilcraft = { group = "dev.dubhe", name = "anvilcraft-neoforge-1.21.1", version.ref = "anvilcraft" }
jade = { group = "curse.maven", name = "jade-324717", version.ref = "jade" }
jei = { group = "curse.maven", name = "jei-238222", version.ref = "jei" }
emi = { group = "curse.maven", name = "emi-580555", version.ref = "emi" }

[plugins]
modDevGradle = { id = "net.neoforged.moddev", version.ref = "modDevGradle" }
lombok = { id = "io.freefair.lombok", version.ref = "lombok" }
